<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Fresh Fruits App 🛒 - Ammar Ahmed</title>
<style>
*{box-sizing:border-box}body{font-family:'Segoe UI',Arial;margin:0;background:#f0f2ff}
.hero{background:linear-gradient(135deg,#ff758c,#ff7eb3);color:#fff;padding:32px 20px;text-align:center;border-radius:0 0 28px 28px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.hero h1{font-size:32px;margin:0}.hero p{opacity:.9}
.wrap{max-width:900px;margin:0 auto;padding:18px}
.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 6px 20px rgba(0,0,0,.08);border-left:6px solid #ff6b6b}
button{background:linear-gradient(90deg,#ff6b6b,#ffa502);color:#fff;border:0;padding:12px 18px;border-radius:999px;margin:5px;cursor:pointer;font-weight:700;box-shadow:0 4px 12px rgba(255,107,107,.4)}
button.blue{background:linear-gradient(90deg,#4facfe,#00f2fe)}button.green{background:linear-gradient(90deg,#43e97b,#38f9d7)}button.purple{background:linear-gradient(90deg,#a18cd1,#fbc2eb);color:#333}
input,select,textarea{padding:12px;margin:5px;border:2px solid #e5e7eb;border-radius:12px;width:92%;font-size:15px}
.bar{display:inline-block;width:28px;margin:2px;border-radius:8px 8px 0 0;text-align:center;color:#fff;font-weight:700}
.pill{display:inline-block;padding:6px 12px;border-radius:999px;background:#fff3cd;margin:3px;font-size:13px;font-weight:700}
.badge{background:#ff4757;color:#fff;padding:4px 10px;border-radius:999px;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body>
<div class='hero'><div style='font-size:52px'>🛒</div><h1>Fresh Fruits App 🛒</h1><p>By Ammar Ahmed | Live on GitHub Pages | Made with ❤️</p><div><span class='pill'>🔥 LIVE</span><span class='pill'>⭐ 4.8 Rating</span><span class='pill'>🚀 2026</span></div></div>
<div class='wrap'><div class='card'><h2>🍎 Order Fruits - Free Delivery Above Rs 500!</h2><input id='s' placeholder='Search...' oninput='render()'><div id='grid'></div><h3>🛒 Cart: <span id='cnt'>0</span> | Rs <span id='tot'>0</span></h3><button onclick='checkout()'>Checkout 🚀</button></div></div><script>let fruits=[{n:'Mango 🥭',p:120},{n:'Apple 🍎',p:180},{n:'Banana 🍌',p:40},{n:'Orange 🍊',p:80}];let cart=[];function render(){let q=document.getElementById('s').value.toLowerCase();document.getElementById('grid').innerHTML=fruits.filter(f=>f.n.toLowerCase().includes(q)).map(f=>`<div style='background:#fff;padding:12px;border-radius:14px;margin:6px;display:inline-block;width:45%'>${f.n}<br>Rs ${f.p}<br><button onclick="add('${f.n}',${f.p})">Add</button></div>`).join('');}function add(n,p){let e=cart.find(x=>x.n===n);if(e)e.q++;else cart.push({n,p,q:1});document.getElementById('cnt').innerText=cart.reduce((a,b)=>a+b.q,0);document.getElementById('tot').innerText=cart.reduce((a,b)=>a+b.p*b.q,0);}function checkout(){alert('🎉 Order placed!');cart=[];document.getElementById('cnt').innerText=0;document.getElementById('tot').innerText=0;}render();</script></body></html>
