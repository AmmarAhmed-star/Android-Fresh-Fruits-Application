<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Fresh Fruits Android</title><style>body{font-family:Arial;max-width:800px;margin:0 auto;padding:20px;background:#f8fafc}button{background:#2563eb;color:#fff;border:0;padding:10px 14px;border-radius:8px;margin:4px;cursor:pointer}input,select,textarea{padding:10px;margin:4px;border:1px solid #ccc;border-radius:8px;width:90%}.card{background:#fff;padding:16px;border-radius:12px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.08)}</style></head><body><h1>Fresh Fruits Shopping - Android</h1><div class='card'><h3>Android Studio Project - Fresh Fruits Shopping - Android</h3><p>Kotlin + XML + Room Database + RecyclerView + MVVM</p><input id='inp' placeholder='Add new item'><button onclick='add()'>Add</button><ul id='ul'></ul><p id='tot'></p></div><script>let items=['Mango Rs 120', 'Apple Rs 180', 'Banana Rs 40'];function render(){document.getElementById('ul').innerHTML=items.map((x,i)=>`<li>${x} <button onclick='del(${i})'>Delete</button></li>`).join('');document.getElementById('tot').innerText='Total items: '+items.length;}function add(){let v=document.getElementById('inp').value;if(!v)return;items.push(v);document.getElementById('inp').value='';render();}function del(i){items.splice(i,1);render();}render();</script></body></html>
